```properties
# =========================================================
# APPLICATION
# =========================================================

spring.application.name=MediCapsLabManagement

server.port=8080


# =========================================================
# JSP VIEW CONFIGURATION
# =========================================================

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medicaps_lab_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=INFO
```
